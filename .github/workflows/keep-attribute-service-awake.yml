# The attribute service runs on a free Hugging Face Space, which pauses after
# 48 hours without a request. A health check every 6 hours keeps it awake so
# the first customer of the day never waits on a cold start. It also doubles
# as an uptime check: a failing ping fails the run, which GitHub emails about.
#
# Set the repository variable ATTRIBUTE_SERVICE_HEALTH_URL to the Space's
# /health URL (Settings -> Secrets and variables -> Actions -> Variables).
# For a private Space also add the secret ATTRIBUTE_SERVICE_TOKEN.

name: Keep attribute service awake

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.ATTRIBUTE_SERVICE_HEALTH_URL != '' }}
    steps:
      - name: Ping /health
        env:
          URL: ${{ vars.ATTRIBUTE_SERVICE_HEALTH_URL }}
          TOKEN: ${{ secrets.ATTRIBUTE_SERVICE_TOKEN }}
        run: |
          set -euo pipefail
          auth=()
          if [ -n "${TOKEN:-}" ]; then auth=(-H "Authorization: Bearer $TOKEN"); fi
          # A paused Space answers slowly on the first hit; give it time.
          for attempt in 1 2 3; do
            if out=$(curl -sS --max-time 120 "${auth[@]}" "$URL"); then
              echo "$out" | grep -q '"ok":true' && { echo "awake: $out"; exit 0; }
            fi
            sleep 30
          done
          echo "service did not report ok after 3 attempts" >&2
          exit 1
